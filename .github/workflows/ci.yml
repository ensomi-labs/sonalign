name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify for a release
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Package native library and CLI
        run: python scripts/build.py --host
      - name: Compile and run the packaged C consumer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sonalign_target="$(rustc -vV | sed -n 's/^host: //p')"
          sonalign_package=".build/dist/sonalign-$sonalign_target"
          sonalign_system_libs=(-lpthread -ldl -lm)
          if [[ "$RUNNER_OS" == macOS ]]; then
            sonalign_system_libs+=(-liconv)
          fi
          cc -std=c11 -Wall -Wextra -Werror -I "$sonalign_package/include" \
            tests/ffi_smoke.c "$sonalign_package/lib/libsonalign.a" \
            "${sonalign_system_libs[@]}" -o .build/ffi-smoke
          .build/ffi-smoke
          sonalign_relocated=.build/relocated-c-consumer
          mkdir -p "$sonalign_relocated/lib"
          sonalign_rpath='$ORIGIN/lib'
          sonalign_dynamic=libsonalign.so
          if [[ "$RUNNER_OS" == macOS ]]; then
            sonalign_rpath='@executable_path/lib'
            sonalign_dynamic=libsonalign.dylib
          fi
          cp "$sonalign_package/lib/$sonalign_dynamic" "$sonalign_relocated/lib/"
          cc -std=c11 -Wall -Wextra -Werror -I "$sonalign_package/include" \
            tests/ffi_smoke.c -L "$sonalign_relocated/lib" -lsonalign -lm \
            -Wl,-rpath,"$sonalign_rpath" -o .build/ffi-dynamic
          mv .build/ffi-dynamic "$sonalign_relocated/ffi-smoke"
          if [[ "$RUNNER_OS" == macOS ]]; then
            [[ "$(otool -L "$sonalign_relocated/ffi-smoke")" == *'@rpath/libsonalign.dylib'* ]]
          fi
          "$sonalign_relocated/ffi-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: sonalign-native-${{ matrix.os }}
          path: .build/dist/*.zip
          if-no-files-found: error

  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --all-targets

  apple:
    name: Apple XCFramework and Swift package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build Apple and Android static libraries
        run: python scripts/build.py --apple --android
      - name: Test the Swift wrapper with the built XCFramework
        run: SONALIGN_XCFRAMEWORK_PATH="$PWD/.build/dist/SonalignFFI.xcframework" python scripts/test_swift.py
      - uses: actions/upload-artifact@v4
        with:
          name: sonalign-apple-android
          path: .build/dist/*.zip
          if-no-files-found: error
